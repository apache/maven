# Lints the GitHub Actions workflows themselves with actionlint, via the shared
# reusable workflow in apache/maven-gh-actions-shared. Only runs when a workflow
# file changes.
name: Actionlint

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

# cancel superseded runs on the same ref (e.g. rapid pushes to a branch)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    uses: apache/maven-gh-actions-shared/.github/workflows/actionlint.yml@v5
