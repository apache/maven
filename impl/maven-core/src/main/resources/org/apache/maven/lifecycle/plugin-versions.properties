# Default lifecycle plugin versions.
# Values are substituted by Maven resource filtering at build time from
# POM properties (version.maven-<name>-plugin), making them visible to
# dependency-update bots such as Dependabot and Renovate.

maven-clean-plugin.version=${version.maven-clean-plugin}
maven-compiler-plugin.version=${version.maven-compiler-plugin}
maven-deploy-plugin.version=${version.maven-deploy-plugin}
maven-ear-plugin.version=${version.maven-ear-plugin}
maven-ejb-plugin.version=${version.maven-ejb-plugin}
maven-install-plugin.version=${version.maven-install-plugin}
maven-jar-plugin.version=${version.maven-jar-plugin}
maven-plugin-plugin.version=${version.maven-plugin-plugin}
maven-rar-plugin.version=${version.maven-rar-plugin}
maven-resources-plugin.version=${version.maven-resources-plugin}
maven-site-plugin.version=${version.maven-site-plugin}
maven-surefire-plugin.version=${version.maven-surefire-plugin}
maven-war-plugin.version=${version.maven-war-plugin}
