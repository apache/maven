
# ------------------------------------------------------------
# Define the main entry-point
# ------------------------------------------------------------

main is org.apache.maven.app.App from maven

# ------------------------------------------------------------
# Start defining realms
# ------------------------------------------------------------

[xml]
  load ${basedir}/target/test-lib/jakarta.xml.bind-api.jar

[ant]
  import jakarta.xml.bind from xml
  load ${basedir}/target/test-lib/ant.jar

[maven]
  import jakarta.xml.bind from xml
  load ${basedir}/target/test-lib/log4j-api.jar

[glob]
  load ${basedir}/target/test-jars/*.jar
