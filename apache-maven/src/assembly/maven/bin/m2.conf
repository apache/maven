# ============================================================================
# Classworlds configuration for Apache Maven
# ============================================================================
#
# This file defines the JPMS module layers and classloader realms used by
# Maven at runtime.  It is parsed by the classworlds Launcher before any
# Maven code runs.
#
# Syntax reference
# ----------------
#
# Global directives (before any section):
#   main is <class> from <realm>     Entry point class and its realm.
#   set <prop> default <value>       Set a system property if not already set.
#
# Layer and realm names share a single namespace — duplicates are forbidden.
#
# JPMS layer sections — [layer <name>]:
#   module <glob>                    Add JARs to this layer's module path.
#                                    Each layer becomes a sibling ModuleLayer
#                                    under ModuleLayer.boot().  ClassLoader
#                                    parents chain in declaration order.
#
# ClassLoader realm sections — [<name>]:
#   parent <name>                    Set the realm's parent classloader to
#                                    the named layer or realm.
#   load <glob>                      Add JARs to the realm's classpath.
#   optionally <glob>                Add JARs if they exist, ignore otherwise.
#   import <pkg> from <realm>        Import a package from another realm.
#   import-exported from <realm>     Import all packages declared as exported
#                                    in META-INF/maven/extension.xml descriptors
#                                    found on the source realm's classpath.
#
# JPMS access directives (any section or top-level):
#   add-exports <mod>/<pkg>=<target> Export a package from a named module.
#   add-opens   <mod>/<pkg>=<target> Open a package for deep reflection.
#   add-reads   <mod>=<target>       Add a reads edge between modules.
#
# Property interpolation:
#   ${name}             Replaced with the system property value.
#   ${name:-default}    Use default when the property is absent or empty.
#
# Lines starting with '#' are comments.  Blank lines are ignored.
# ============================================================================

main is org.apache.maven.cling.MavenCling from plexus.core

set maven.conf default ${maven.home}/conf
set maven.user.conf default ${user.home}/.m2

# --- JPMS module layers ---
# Layers are siblings under ModuleLayer.boot().  Their classloaders chain
# in declaration order: infra → api, so plexus.core (parented to api)
# can reach both layers via classloader delegation.

[layer infra]
module ${maven.home}/lib/modules/*.jar

[layer api]
module ${maven.home}/lib/api/*.jar

# --- ClassLoader realms ---

[plexus.core]
parent     api
load       ${maven.conf}/logging
optionally ${maven.user.conf}/ext/*.jar
optionally ${maven.home}/lib/ext/*.jar
load       ${maven.home}/lib/maven-*.jar
load       ${maven.home}/lib/*.jar

[maven.api]
import-exported from plexus.core

[maven.api.v4]
parent layer api
import org.slf4j from plexus.core
